# Change these first
owner: kuakuacr # Your GitHub organization or username, where this repository lives
repo: kuakua-status # The name of this repository

sites:
  - name: Sitio web
    url: https://kuakua.art
  - name: Pedidos por WhatsApp
    url: https://chat.kuakua.cr
  - name: Seguimiento de envíos
    url: https://go.kuakua.cr
    # La raíz sin token de envío da 404 a propósito (ver kuakua-infra/monitoring/monitors.yml) — solo 5xx/timeout son caída real
    expectedStatusCodes:
      - 200
      - 404
  - name: Tarjetas (Nota Floral)
    url: https://tarjetas.kuakua.cr

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  cname: status.kuakua.cr
  logoUrl: https://raw.githubusercontent.com/kuakuacr/kuakua-status/main/assets/logo-badge.png
  favicon: https://raw.githubusercontent.com/kuakuacr/kuakua-status/main/assets/favicon.png
  themeUrl: https://raw.githubusercontent.com/kuakuacr/kuakua-status/main/assets/kuakua-theme.css
  name: Kua'kua — Estado
  introTitle: "**Estado de los servicios de Kua'kua**"
  introMessage: Acá podés ver en tiempo real si nuestros canales de pedidos, sitio web y seguimiento de envíos están funcionando. Si algo está caído, se va a ver reflejado acá apenas lo detectemos.
  navbar:
    - title: Estado
      href: /
    - title: Kua'kua
      href: https://kuakua.art

# Upptime también soporta notificaciones, asignar issues, y más
# Ver https://upptime.js.org/docs/configuration
